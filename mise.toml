[tools]
# Project toolchains. Language package managers come with their runtimes;
# listing npm, cargo, pip, or gofmt as independent mise plugins is invalid.
bun = "latest"
node = "latest"
rust = "latest"
zig = "latest"

[env]
# Common environment variables
NODE_ENV = "development"
PYTHONDONTWRITEBYTECODE = "1"
PYTHONUNBUFFERED = "1"

[tasks.build]
run = "opam exec -- dune build"

[tasks.test]
run = "opam exec -- dune runtest"

[tasks.bun-esm-test]
run = "./tools/run_codegen_bun_tests.sh"
